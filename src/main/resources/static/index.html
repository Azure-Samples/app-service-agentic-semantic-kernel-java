<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager with AI Agents</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .chat-messages {
            height: 400px;
            overflow-y: auto;
        }
        .chat-message {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .agent-selector {
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="bg-light">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Task List Component
        function TaskList({ refreshTrigger }) {
            const [tasks, setTasks] = useState([]);
            const [newTaskTitle, setNewTaskTitle] = useState('');

            const loadTasks = async () => {
                const response = await fetch('/api/tasks');
                if (response.ok) {
                    setTasks(await response.json());
                }
            };

            const addTask = async () => {
                if (!newTaskTitle.trim()) return;
                
                const response = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `title=${encodeURIComponent(newTaskTitle)}`
                });
                
                if (response.ok) {
                    setNewTaskTitle('');
                    loadTasks();
                }
            };

            const toggleTask = async (task) => {
                const response = await fetch(`/api/tasks/${task.id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ...task, complete: !task.complete })
                });
                
                if (response.ok) {
                    loadTasks();
                }
            };

            const deleteTask = async (id) => {
                const response = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    loadTasks();
                }
            };

            useEffect(() => {
                loadTasks();
            }, []);

            // Refresh tasks when refreshTrigger changes
            useEffect(() => {
                if (refreshTrigger > 0) {
                    loadTasks();
                }
            }, [refreshTrigger]);

            return (
                <div className="card h-100">
                    <div className="card-body">
                        <h5 className="card-title">Task Manager</h5>
                        
                        <div className="input-group mb-3">
                            <input
                                type="text"
                                className="form-control"
                                value={newTaskTitle}
                                onChange={(e) => setNewTaskTitle(e.target.value)}
                                placeholder="Enter new task..."
                                onKeyPress={(e) => e.key === 'Enter' && addTask()}
                            />
                            <button
                                className="btn btn-primary"
                                onClick={addTask}
                                disabled={!newTaskTitle.trim()}
                            >
                                Add
                            </button>
                        </div>

                        <div style={{ maxHeight: '400px', overflowY: 'auto' }}>
                            {tasks.length === 0 ? (
                                <div className="text-center text-muted p-3">
                                    No tasks yet. Add one above!
                                </div>
                            ) : (
                                tasks.map(task => (
                                    <div key={task.id} className={`card mb-2 ${task.complete ? 'text-decoration-line-through' : ''}`}>
                                        <div className="card-body py-2">
                                            <div className="d-flex justify-content-between align-items-center">
                                                <div>
                                                    <strong>{task.title}</strong>
                                                    <div className="small text-muted">
                                                        ID: {task.id} | {task.complete ? 'Complete' : 'Pending'}
                                                    </div>
                                                </div>
                                                <div className="btn-group btn-group-sm">
                                                    <button
                                                        className={`btn ${task.complete ? 'btn-outline-secondary' : 'btn-outline-success'}`}
                                                        onClick={() => toggleTask(task)}
                                                    >
                                                        {task.complete ? 'Undo' : 'Complete'}
                                                    </button>
                                                    <button
                                                        className="btn btn-outline-danger"
                                                        onClick={() => deleteTask(task.id)}
                                                    >
                                                        Delete
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // Chat Component with Dual Agent Support
        function ChatInterface({ onChatResponse }) {
            const [messagesSemanticKernel, setMessagesSemanticKernel] = useState([]);
            const [messagesFoundry, setMessagesFoundry] = useState([]);
            const [currentMessage, setCurrentMessage] = useState('');
            const [loading, setLoading] = useState(false);
            const [selectedAgent, setSelectedAgent] = useState('semantic-kernel');
            const [sessionIds] = useState(() => ({
                'semantic-kernel': 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
                'foundry': 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9)
            }));

            // Get current messages based on selected agent
            const currentMessages = selectedAgent === 'semantic-kernel' ? messagesSemanticKernel : messagesFoundry;
            const setCurrentMessages = selectedAgent === 'semantic-kernel' ? setMessagesSemanticKernel : setMessagesFoundry;

            const sendMessage = async () => {
                if (!currentMessage.trim() || loading) return;
                
                const userMessage = { role: 'user', content: currentMessage };
                setCurrentMessages(prev => [...prev, userMessage]);
                const messageToSend = currentMessage;
                setCurrentMessage('');
                setLoading(true);

                try {
                    const endpoint = selectedAgent === 'semantic-kernel' 
                        ? '/api/agents/semantic-kernel/chat' 
                        : '/api/agents/foundry/chat';
                    const sessionId = sessionIds[selectedAgent];
                    
                    const response = await fetch(`${endpoint}?message=${encodeURIComponent(messageToSend)}&sessionId=${encodeURIComponent(sessionId)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    
                    if (response.ok) {
                        const text = await response.text();
                        setCurrentMessages(prev => [...prev, { role: 'assistant', content: text }]);
                        
                        // Trigger task list refresh after receiving AI response
                        if (onChatResponse) {
                            onChatResponse();
                        }
                    } else {
                        const errorMessage = { 
                            role: 'assistant', 
                            content: 'Sorry, I encountered an error processing your request.' 
                        };
                        setCurrentMessages(prev => [...prev, errorMessage]);
                    }
                } catch (err) {
                    console.error('Chat error:', err);
                    const errorMessage = { 
                        role: 'assistant', 
                        content: 'Sorry, I couldn\'t connect to the server.' 
                    };
                    setCurrentMessages(prev => [...prev, errorMessage]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="card h-100">
                    <div className="card-body d-flex flex-column">
                        <div className="d-flex justify-content-between align-items-center mb-3">
                            <h5 className="card-title mb-0">AI Assistant</h5>
                        </div>
                        
                        <div className="agent-selector">
                            <div className="btn-group w-100" role="group">
                                <input 
                                    type="radio" 
                                    className="btn-check" 
                                    id="semantic-kernel" 
                                    value="semantic-kernel"
                                    checked={selectedAgent === 'semantic-kernel'}
                                    onChange={(e) => setSelectedAgent(e.target.value)}
                                />
                                <label className="btn btn-outline-primary" htmlFor="semantic-kernel">
                                    Semantic Kernel
                                </label>

                                <input 
                                    type="radio" 
                                    className="btn-check" 
                                    id="foundry" 
                                    value="foundry"
                                    checked={selectedAgent === 'foundry'}
                                    onChange={(e) => setSelectedAgent(e.target.value)}
                                />
                                <label className="btn btn-outline-info" htmlFor="foundry">
                                    Foundry Agent Service
                                </label>
                            </div>
                        </div>
                        
                        <div className="chat-messages border rounded p-3 mb-3 bg-light flex-grow-1">
                            {currentMessages.length === 0 ? (
                                <div className="text-center text-muted">
                                    Start a conversation with the AI assistant<br/>
                                    for task management!<br/>
                                    <small>
                                        Selected: {selectedAgent === 'semantic-kernel' ? 'Semantic Kernel Agent' : 'Foundry Agent'}
                                    </small>
                                </div>
                            ) : (
                                currentMessages.map((message, index) => (
                                    <div key={index} className={`chat-message mb-3 p-2 rounded ${
                                        message.role === 'user' ? 'bg-primary text-white ms-5' : 'bg-white me-5'
                                    }`}>
                                        <div className="fw-bold mb-1">
                                            {message.role === 'user' ? 'You' : 
                                             selectedAgent === 'semantic-kernel' ? 'Semantic Kernel Assistant' : 'Foundry Assistant'}
                                        </div>
                                        <div>{message.content}</div>
                                    </div>
                                ))
                            )}
                            {loading && (
                                <div className="chat-message mb-3 p-2 rounded bg-white me-5">
                                    <div className="fw-bold mb-1">
                                        {selectedAgent === 'semantic-kernel' ? 'Semantic Kernel Assistant' : 'Foundry Assistant'}
                                    </div>
                                    <div>Thinking...</div>
                                </div>
                            )}
                        </div>
                        
                        <div className="input-group">
                            <input
                                type="text"
                                className="form-control"
                                value={currentMessage}
                                onChange={(e) => setCurrentMessage(e.target.value)}
                                placeholder="Type your message..."
                                onKeyPress={(e) => e.key === 'Enter' && sendMessage()}
                                disabled={loading}
                            />
                            <button
                                className="btn btn-primary"
                                onClick={sendMessage}
                                disabled={loading || !currentMessage.trim()}
                            >
                                Send
                            </button>
                            <button
                                className="btn btn-outline-secondary"
                                onClick={() => {
                                    setCurrentMessages([]);
                                }}
                                disabled={loading}
                            >
                                Clear
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [taskRefreshTrigger, setTaskRefreshTrigger] = useState(0);

            const handleChatResponse = () => {
                // Increment trigger to cause task list refresh
                setTaskRefreshTrigger(prev => prev + 1);
            };

            return (
                <div className="container py-4">
                    <div className="text-center mb-4">
                        <h1 className="display-4 text-primary">Task Manager with AI Agents</h1>
                        <p className="lead">Manage your tasks with Semantic Kernel and Foundry Agents</p>
                        <div className="badge bg-secondary">Java Version</div>
                    </div>
                    
                    <div className="row g-4">
                        <div className="col-md-6">
                            <TaskList refreshTrigger={taskRefreshTrigger} />
                        </div>
                        <div className="col-md-6">
                            <ChatInterface onChatResponse={handleChatResponse} />
                        </div>
                    </div>
                    
                    <div className="text-center mt-4">
                        <small className="text-muted">
                            Built with Spring Boot, Semantic Kernel, and Foundry Agent Service
                        </small>
                    </div>
                </div>
            );
        }

        // Render the app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
